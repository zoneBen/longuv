name: ci

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: vet
        run: go vet ./...
      - name: test
        run: |
          set -o pipefail
          go test -race -json ./... 2>&1 | tee /tmp/go-test.json
      - name: annotate test failures
        if: failure()
        run: python3 .github/scripts/annotate_tests.py /tmp/go-test.json
      - name: selftest
        run: go run ./cmd/iadu-sim --selftest

  packages:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build snapshot packages
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: check deb packages
        run: |
          set -euo pipefail
          ls -lh dist
          arches=""
          for f in dist/*.deb; do
            a=$(dpkg-deb -f "$f" Architecture)
            echo "$f -> $a"
            arches="$arches $a"
            if ! dpkg-deb -c "$f" | grep -q './usr/bin/iadu-sim'; then
              echo "::error file=$f::deb is missing /usr/bin/iadu-sim"
              exit 1
            fi
          done
          for want in amd64 arm64 armhf; do
            if ! echo "$arches" | grep -qw "$want"; then
              echo "::error::missing deb architecture $want (got:$arches)"
              exit 1
            fi
          done
      - name: check rpm packages
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm >/dev/null
          for f in dist/*.rpm; do
            echo "== $f"
            if ! rpm -qpi "$f" | grep -E '^(Name|Version|Architecture)'; then
              echo "::error file=$f::rpm metadata unreadable"
              exit 1
            fi
            if ! rpm -qp --scripts "$f" >/dev/null; then
              echo "::error file=$f::rpm scriptlets unreadable"
              exit 1
            fi
          done
      - name: install deb on ubuntu 18 (smoke)
        run: |
          docker run --rm -v "$PWD/dist:/dist" ubuntu:18.04 sh -c '
            set -e
            dpkg -i /dist/*_amd64.deb
            /usr/bin/iadu-sim --version
            /usr/bin/iadu-sim --selftest
          '
      - name: install rpm on centos 7 (best effort)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD/dist:/dist" centos:7 sh -c '
            set -e
            rpm -Uvh /dist/*_linux_amd64.rpm
            /usr/bin/iadu-sim --version
            /usr/bin/iadu-sim --selftest
          '
      - uses: actions/upload-artifact@v4
        with:
          name: iadu-sim-packages
          path: dist/*
