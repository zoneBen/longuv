name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - name: test
        run: |
          set -o pipefail
          go test -race -json ./... 2>&1 | tee /tmp/go-test.json
      - name: annotate test failures
        if: failure()
        run: python3 .github/scripts/annotate_tests.py /tmp/go-test.json
      - run: go run ./cmd/iadu-sim --selftest

  release:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: ${{ startsWith(github.ref, 'refs/tags/v') && 'release --clean' || 'release --snapshot --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: verify packages
        run: |
          set -euo pipefail
          for f in dist/*.deb; do
            echo "$f -> $(dpkg-deb -f "$f" Architecture)"
            listing=$(dpkg-deb -c "$f")
            grep -q './usr/bin/iadu-sim' <<<"$listing" || {
              echo "::error file=$f::deb is missing /usr/bin/iadu-sim"
              exit 1
            }
          done
          for f in dist/*.rpm; do
            echo "== $f"
            if command -v rpm >/dev/null; then rpm -qpi "$f" | grep -E '^(Name|Version|Architecture)'; fi
          done
      - name: upload manual artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: iadu-sim-snapshot
          path: dist/*
